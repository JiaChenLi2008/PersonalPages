name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages needs read access to the repo plus a Pages deployment token.
# Action majors below are the current ones on github.com/actions (verified via
# each repository's releases/latest redirect); they all carry the inputs used here.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap static gates first, so a broken deploy config fails fast.
      - name: Verify design tokens
        run: node tools/verify-tokens.mjs

      - name: Verify deploy configuration
        run: node tools/verify-deploy.mjs

      - name: Build
        # vite.config.ts sets base: "./", so project subpaths need no BASE override.
        run: npm run build

      # Reads dist/assets/*.js, so it has to run after the build step above.
      - name: Verify copy wiring in the bundle
        run: node tools/verify-copy-wiring.mjs

      # Repo-internal gates, ordered cheapest first: both read only files in the
      # checkout (index.html + dictionary, tokens.css + sections).
      - name: Verify document head vs dictionary
        run: node tools/verify-head.mjs

      - name: Verify responsive values
        run: node tools/verify-responsive.mjs

      # Runs its own vite SSR build into /tmp (Vite JS API), so it needs
      # node_modules but not dist/: slowest of the three, hence last.
      - name: Verify SSR DOM
        run: node tools/verify-ssr-dom.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
